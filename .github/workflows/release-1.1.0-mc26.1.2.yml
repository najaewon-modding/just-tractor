name: Release 1.1.0-mc26.1.2

on:
  push:
    paths:
      - '.github/workflows/release-1.1.0-mc26.1.2.yml'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release commit
        uses: actions/checkout@v4
        with:
          ref: 50a2ad1a4aea97c1a83aa6854519da164502f63c
          fetch-depth: 0
          fetch-tags: true

      - name: Setup JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build release
        run: ./gradlew build

      - name: Write release notes
        run: |
          cat > release-notes.md <<'EOF'
          # Just Tractor v1.1.0-mc26.1.2

          This release introduces the new attachment system and turns the base tractor into a simple vehicle whose farming behavior depends entirely on the installed attachment.

          ## Highlights

          * Added a dedicated attachment slot to the tractor inventory.
          * Added **Harvester Attachment**, **Tiller Attachment**, and **Planter Attachment**.
          * A tractor without an attachment now behaves only as a drivable vehicle and performs no farming actions.
          * Harvester Attachment enables automatic harvesting of fully grown `CropBlock` crops, automatic replanting when possible, cargo collection, and Fortune upgrade effects.
          * Tiller Attachment applies vanilla hoe tilling behavior while driving, but only where actual water exists within the normal farmland hydration range. Rain does not count as a water source.
          * Planter Attachment plants supported crop items on empty farmland using the driver's main hand first, then falls back to the off hand if the main hand cannot plant.
          * Redesigned and widened the tractor inventory GUI with a dedicated attachment panel and contextual attachment descriptions.
          * Improved Korean and English description wrapping in the attachment panel.
          * Refined tractor and attachment item visuals.

          ## Crop Compatibility

          Harvester and Planter behavior primarily targets crops implemented with Minecraft's standard `CropBlock` system. Crops from other mods may work automatically when they follow the same block model.

          Special crops with different growth mechanics, such as pumpkins, melons, sugar cane, or cacti, are not part of the default `CropBlock` workflow.

          ## Requirements

          * Minecraft 26.1.2
          * NeoForge 26.1.2.97
          * Java 25
          EOF

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "v1.1.0-mc26.1.2" "build/libs/njw_just_tractor-1.1.0-mc26.1.2.jar" --target "50a2ad1a4aea97c1a83aa6854519da164502f63c" --title "Just Tractor v1.1.0-mc26.1.2" --notes-file release-notes.md
